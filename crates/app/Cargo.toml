[package]
name = "prompter-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prompter — live script guidance for high-stakes conversations"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pure core only. The app does its speech recognition natively (Swift
# SFSpeechRecognizer sidecar), so the whisper/audio features -- and with them
# whisper-rs-sys (a cmake/C++ build), minutes-core, and cpal -- are dead weight
# since the SFSpeechRecognizer pivot. Dropping them removes the cmake build
# dependency entirely. The portable sherpa engine, when wired, enables
# prompter-core's `sherpa` feature here instead.
prompter-core = { path = "../core", default-features = false }
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
dirs-next = "2"
tauri-plugin-deep-link = "2"
